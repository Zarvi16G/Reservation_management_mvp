{% extends "base.html" %}
{% load i18n %}

{% block title %}{% translate "Change password" %}{% endblock %}

{% block content %}
  <div class="mx-auto w-full max-w-md">
    <h1>{% translate "Change password" %}</h1>
    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" with form=form %}
      <button type="submit">{% translate "Change password" %}</button>
    </form>
    <p class="mt-6"><a href="{% url 'profile' %}">{% translate "Back to my profile" %}</a></p>
  </div>
{% endblock %}
