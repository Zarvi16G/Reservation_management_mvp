# Installed on the VPS as /etc/nginx/sites-available/00-default (linked from
# sites-enabled). Requests for any other name (e.g. the bare IP, scanners)
# get no answer instead of reaching a project.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
