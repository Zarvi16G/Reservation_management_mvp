# Installed on the VPS as /etc/nginx/sites-available/vps.santiagoboada.dev
# (linked from sites-enabled). Certificate: the *.santiagoboada.dev wildcard,
# issued and renewed by certbot (GoDaddy ACME + Cloudflare DNS validation).

# HTTP: everything goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name vps.santiagoboada.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vps.santiagoboada.dev;

    ssl_certificate /etc/letsencrypt/live/santiagoboada.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/santiagoboada.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Court photos uploaded from the admin.
    client_max_body_size 10m;

    # Nginx serves these files itself, without reaching Django.
    location /static/ {
        alias /srv/reservas/staticfiles/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias /srv/reservas/media/;
        expires 7d;
    }

    # Everything else goes to Gunicorn in the `web` container.
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        # $remote_addr is the visitor's real IP (see cloudflare-realip.conf).
        # Replaced, not appended: the app trusts this header for rate limits
        # (USE_X_FORWARDED_FOR=True), so a visitor must not be able to fake it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
